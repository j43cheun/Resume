name: Build resume
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:TL2025-historic
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Compile
      run: xelatex resume.tex
    - name: Install ATS validation dependencies
      run: |
        apt-get update
        apt-get install -y --no-install-recommends poppler-utils python3
    - name: Validate ATS compliance
      run: python3 scripts/validate_ats.py resume.pdf
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: resume
        path: resume.pdf
    - name: "Generate build tag"
      run: |
        echo "tag="resume-$(date +'%Y-%m-%d-%H%M').pdf"" >> $GITHUB_OUTPUT
      id: version
    - name: "Rename file"
      run: |
        mv resume.pdf ${{ steps.version.outputs.tag }}
    - name: Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }}
        files: |
          ${{ steps.version.outputs.tag }}